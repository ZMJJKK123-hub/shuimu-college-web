<!DOCTYPE html>
<!-- ============================================================
     页面：轮播内容管理页（site/admin/index.html）——最初版
     职责：管理员经表单编辑首页轮播四接口（主办方/标题/介绍/跳转），
           保存调用后端 PUT /api/banners，即时写回 site/data/banners.js。
     运行：本地需先启动后端（server/ 下 npm run dev，端口 3000）；
           线上经 Nginx 同域反代，无需任何配置。
     ============================================================ -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轮播管理 - 水木书院科协官网</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/layout.css">
  <link rel="stylesheet" href="../assets/css/footer.css">
  <style>
    /* 管理页专属样式（复用 base.css 的清华紫令牌） */
    body { background: var(--purple-bg); min-height: 100vh; }
    .admin-wrap { width: min(860px, 94%); margin: 40px auto 80px; }
    .admin-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 22px; }
    .admin-head h1 { font-size: 26px; color: var(--text-dark); letter-spacing: 2px; }
    .admin-head a { font-size: 14px; color: var(--purple); }
    .slide-card { background: #fff; border: 1px solid var(--line); border-radius: 14px;
      padding: 22px 24px; margin-bottom: 18px; box-shadow: var(--shadow); }
    .slide-card .no { font-size: 13px; color: var(--purple); font-weight: 700; margin-bottom: 12px; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 4px; }
    .field label b { color: var(--text-main); }
    .field input { width: 100%; box-sizing: border-box; border: 1px solid var(--line);
      border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; }
    .field input:focus { outline: none; border-color: var(--purple); }
    .link-row { display: flex; gap: 12px; }
    .link-row .field { flex: 1; }
    .card-ops { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
    .btn { border: 0; border-radius: 20px; padding: 8px 20px; font-size: 14px;
      font-family: inherit; cursor: pointer; }
    .btn.ghost { background: #fff; color: var(--text-sub); border: 1px solid var(--line); }
    .btn.ghost:hover { color: #d34141; border-color: #d34141; }
    .btn.primary { background: var(--purple); color: #fff; }
    .btn.primary:hover { background: var(--purple-hover); }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .status { font-size: 13px; padding: 8px 0; min-height: 20px; }
    .status.ok { color: #1d9e4a; }
    .status.err { color: #d34141; }
    .hint { font-size: 12px; color: var(--text-sub); margin-top: 14px; line-height: 1.8; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-head">
      <h1>首页轮播管理</h1>
      <a href="../index.html">← 返回官网</a>
    </div>

    <div class="toolbar">
      <button class="btn ghost" id="add-slide" type="button">＋ 添加一张</button>
      <button class="btn primary" id="save" type="button">保存并发布</button>
    </div>
    <div class="status" id="status">正在加载……</div>
    <div id="slides"></div>
    <p class="hint">
      字段说明：主办方（选填，留空则不显示该行）；标题必填；介绍选填；跳转选填（留空则无按钮）。<br>
      保存后首页轮播即时更新（强刷浏览器 Ctrl+F5 可见）。若提示无法连接后端：
      在 server/ 目录运行 <b>npm run dev</b> 启动后端（端口 3000）。
    </p>
  </div>

  <!-- 页面逻辑已抽出为 TypeScript 源码（assets/admin.ts），
       经 tsc 编译产出本文件引用的 assets/admin.js（产物不入库，本地构建） -->
  <script src="assets/admin.js"></script>
</body>
</html>
