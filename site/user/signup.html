<!DOCTYPE html>
<!-- ============================================================
     页面：用户板块 / 注册页（user/signup.html）——裸页版
     内容：整页无站点骨架（无页头/导航/页脚），清华紫渐变底 +
           极简白卡注册框（账号 + 密码 + 确认密码，无任何手机/邮箱
           验证渠道；确认密码框防止口令输错导致账号无法找回）
     依赖：assets/css/{base,user/user}.css + assets/auth.service.js
           + assets/signup.js（不挂全站公共脚本与 main.js）
     ============================================================ -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册账号 - 清华大学水木书院学生科学技术协会</title>
  <meta name="description" content="水木书院科协官网账号注册：仅需账号与密码，注册成功即自动登录。">
  <link rel="stylesheet" href="../assets/css/common/base.css">
  <link rel="stylesheet" href="../assets/css/user/user.css">
</head>
<body class="auth-bare">

  <!-- 注册卡片：极简组合输入框（浅底 + 图标 + 占位文字即标签） -->
  <div class="auth-card">
    <div class="auth-head">
      <h1>注册账号</h1>
      <div class="sub">Sign Up</div>
    </div>
    <form id="auth-form" novalidate>
      <div class="auth-fields">
        <div class="auth-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
          <input id="account" type="text" placeholder="账号（4~30 位字母或数字）" autocomplete="username" maxlength="30">
        </div>
        <div class="auth-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          <input id="password" type="password" placeholder="密码（6~64 位）" autocomplete="new-password" maxlength="64">
        </div>
        <div class="auth-field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
          <input id="password2" type="password" placeholder="确认密码（再输入一次）" autocomplete="new-password" maxlength="64">
        </div>
      </div>
      <p class="auth-msg" id="msg" hidden></p>
      <button class="auth-submit" id="submit" type="submit">注 册</button>
    </form>
    <div class="auth-foot">
      <span>已有账号？<a href="signin.html">直接登录</a></span>
      <span>注册成功即自动登录</span>
    </div>
  </div>

  <!-- 裸页最小脚本：auth.service.js 提供 SMSK.auth/SMSK.validateCredential，表单脚本消费 -->
  <script src="assets/auth.service.js"></script>
  <script src="assets/signup.js"></script>
</body>
</html>
